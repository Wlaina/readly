[package]
name = "readly"
version = "0.12.0"
description = "Readly — a lean e-book reader"
edition = "2021"

[lib]
name = "readly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
# 上传书籍文件时报告进度（和 tauri-plugin-http 用同一份 reqwest，只多开 stream）
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = { version = "0.3", default-features = false }
bytes = "1"
# OneDrive 的文件指纹 quickXorHash 用 base64 表示
base64 = "0.22"

tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
